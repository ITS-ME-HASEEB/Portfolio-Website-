<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BOM Management System — Live Demo</title>
<link rel="icon" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/demo.css" />
<style>
  .toolbar{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:.7rem;align-items:end;margin-bottom:1.1rem}
  @media (max-width:760px){.toolbar{grid-template-columns:1fr 1fr}}
  .qty{display:inline-flex;align-items:center;gap:.35rem}
  .qty b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
  .panel--split{display:grid;grid-template-columns:1.35fr .65fr;gap:1.1rem;align-items:start}
  @media (max-width:900px){.panel--split{grid-template-columns:1fr}}
  .stockbar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.35rem;min-width:70px}
  .stockbar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#d946ef)}
</style>
</head>
<body>
<div class="app app--wide">

  <header class="topbar">
    <div class="topbar__mark">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div>
      <div class="topbar__brand">BOM Management System</div>
      <span class="topbar__sub">Bill of materials · inventory control</span>
    </div>
    <div class="topbar__spacer"></div>
    <div class="topbar__right">
      <button class="btn btn--sm" id="seedBtn">Load sample data</button>
      <button class="btn btn--sm" id="exportBtn">Export CSV</button>
      <button class="btn btn--sm btn--primary" id="addBtn">+ Add part</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <div class="field">
      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Part number, name or supplier…" />
    </div>
    <div class="field">
      <label for="catFilter">Category</label>
      <select id="catFilter"><option value="">All categories</option></select>
    </div>
    <div class="field">
      <label for="sortBy">Sort by</label>
      <select id="sortBy">
        <option value="name">Name A–Z</option>
        <option value="qty">Quantity (low → high)</option>
        <option value="value">Stock value (high → low)</option>
        <option value="status">Status</option>
      </select>
    </div>
    <label class="row" style="gap:.45rem">
      <input type="checkbox" id="lowOnly" style="width:auto" />
      <span class="small muted">Low stock only</span>
    </label>
  </div>

  <div class="panel--split">
    <section class="panel">
      <div class="panel__title">Inventory table</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Part no.</th><th>Name</th><th>Category</th><th>Supplier</th>
              <th>Qty</th><th>Unit cost</th><th>Value</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>
        <b>No parts match your filters</b>
        Add a part, clear the filters, or load the sample data.
      </div>
    </section>

    <aside class="panel">
      <div class="panel__title">Stock by category</div>
      <div class="chart" id="chart"></div>
      <hr class="sep" />
      <div class="panel__title">Needs attention</div>
      <ul id="alerts" class="small" style="display:grid;gap:.5rem"></ul>
    </aside>
  </div>
</div>

<!-- add / edit sheet -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__box">
    <h3 id="sheetTitle">Add a new part</h3>
    <form id="partForm" class="sheet__grid">
      <input type="hidden" name="id" />
      <div class="grid2">
        <div class="field"><label for="pno">Part number</label><input id="pno" name="pno" required placeholder="BOM-1042" /></div>
        <div class="field"><label for="cat">Category</label>
          <select id="cat" name="cat">
            <option>Electronics</option><option>Passives</option><option>Connectors</option>
            <option>Mechanical</option><option>LEDs</option><option>ICs</option><option>Packaging</option>
          </select>
        </div>
      </div>
      <div class="field"><label for="name">Part name</label><input id="name" name="name" required placeholder="Resistor 10kΩ 1/4W" /></div>
      <div class="grid2">
        <div class="field"><label for="qty">Quantity in stock</label><input id="qty" name="qty" type="number" min="0" step="1" value="0" required /></div>
        <div class="field"><label for="cost">Unit cost (PKR)</label><input id="cost" name="cost" type="number" min="0" step="0.01" value="0" required /></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="reorder">Reorder level</label><input id="reorder" name="reorder" type="number" min="0" step="1" value="10" required /></div>
        <div class="field"><label for="supplier">Supplier</label><input id="supplier" name="supplier" placeholder="Vendor name" /></div>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:.3rem">
        <button type="button" class="btn btn--ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn--primary">Save part</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const $ = (s,c=document)=>c.querySelector(s);
  const KEY = 'haseeb-bom-parts-v1';

  const SAMPLE = [
    {pno:'BOM-1001',name:'Resistor 10kΩ 1/4W',cat:'Passives',qty:1480,cost:12,reorder:200,supplier:'ElectroHub'},
    {pno:'BOM-1002',name:'Capacitor 100nF X7R',cat:'Passives',qty:860,cost:18,reorder:150,supplier:'ElectroHub'},
    {pno:'BOM-1003',name:'LED 5mm Red',cat:'LEDs',qty:310,cost:9,reorder:120,supplier:'BrightParts'},
    {pno:'BOM-1004',name:'IC STM32F103C8T6',cat:'ICs',qty:42,cost:640,reorder:60,supplier:'ChipSource'},
    {pno:'BOM-1005',name:'JST Connector 4-pin',cat:'Connectors',qty:210,cost:75,reorder:80,supplier:'WireLine'},
    {pno:'BOM-1006',name:'USB-C Receptacle',cat:'Connectors',qty:55,cost:130,reorder:100,supplier:'WireLine'},
    {pno:'BOM-1007',name:'PCB Board 4-Layer',cat:'Electronics',qty:18,cost:820,reorder:40,supplier:'PrintFab'},
    {pno:'BOM-1008',name:'Aluminium Heatsink',cat:'Mechanical',qty:96,cost:240,reorder:50,supplier:'MechWorks'},
    {pno:'BOM-1009',name:'M3 Screw Kit (box)',cat:'Mechanical',qty:6,cost:310,reorder:25,supplier:'MechWorks'},
    {pno:'BOM-1010',name:'Anti-static Bag 8x12"',cat:'Packaging',qty:1200,cost:22,reorder:300,supplier:'PackRight'},
    {pno:'BOM-1011',name:'Sensor DHT22',cat:'Electronics',qty:64,cost:420,reorder:50,supplier:'ChipSource'},
    {pno:'BOM-1012',name:'Crystal 8MHz',cat:'Electronics',qty:22,cost:95,reorder:60,supplier:'ChipSource'}
  ];

  let parts = load();

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ const p = JSON.parse(raw); if(Array.isArray(p)&&p.length) return p; }
    }catch(e){}
    return SAMPLE.map(p=>({...p,id:uid()}));
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(parts)); }catch(e){}
  }
  function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  const toastEl = $('#toast');
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 2400);
  }

  function status(p){
    if(p.qty === 0) return {cls:'badge--bad',label:'Out of stock'};
    if(p.qty <= p.reorder) return {cls:'badge--warn',label:'Low stock'};
    return {cls:'badge--ok',label:'In stock'};
  }

  function filtered(){
    const q = ($('#search').value||'').toLowerCase().trim();
    const cat = $('#catFilter').value;
    const lowOnly = $('#lowOnly').checked;
    const sort = $('#sortBy').value;
    let list = parts.filter(p=>{
      if(cat && p.cat!==cat) return false;
      if(lowOnly && p.qty > p.reorder) return false;
      if(!q) return true;
      return (p.name+' '+p.pno+' '+p.supplier).toLowerCase().includes(q);
    });
    list.sort((a,b)=>{
      if(sort==='name') return a.name.localeCompare(b.name);
      if(sort==='qty') return a.qty-b.qty;
      if(sort==='value') return (b.qty*b.cost)-(a.qty*a.cost);
      if(sort==='status') return a.qty-a.reorder-(b.qty-b.reorder);
      return 0;
    });
    return list;
  }

  function render(){
    const list = filtered();
    const tbody = $('#tbody');
    tbody.innerHTML = '';
    $('#empty').hidden = list.length>0;

    list.forEach(p=>{
      const st = status(p);
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><b>'+esc(p.pno)+'</b></td>'+
        '<td>'+esc(p.name)+'</td>'+
        '<td><span class="badge badge--v">'+esc(p.cat)+'</span></td>'+
        '<td class="muted">'+esc(p.supplier||'—')+'</td>'+
        '<td><div class="qty"><button class="btn btn--icon btn--sm" data-dec="'+p.id+'" aria-label="Decrease">−</button><b>'+p.qty+'</b><button class="btn btn--icon btn--sm" data-inc="'+p.id+'" aria-label="Increase">+</button>'+
          '<div class="stockbar"><i style="width:'+Math.min(100,(p.qty/Math.max(p.reorder*2,1))*100)+'%"></i></div></div></td>'+
        '<td>'+Number(p.cost).toLocaleString()+'</td>'+
        '<td>'+Number(p.qty*p.cost).toLocaleString()+'</td>'+
        '<td><span class="badge '+st.cls+'">'+st.label+'</span></td>'+
        '<td><div class="row-actions">'+
          '<button class="btn btn--sm btn--icon" data-edit="'+p.id+'" title="Edit">✎</button>'+
          '<button class="btn btn--sm btn--icon btn--danger" data-del="'+p.id+'" title="Delete">✕</button>'+
        '</div></td>';
      tbody.appendChild(tr);
    });

    // stats
    const totalValue = parts.reduce((s,p)=>s+p.qty*p.cost,0);
    const lowCount = parts.filter(p=>p.qty<=p.reorder).length;
    const cats = new Set(parts.map(p=>p.cat)).size;
    const units = parts.reduce((s,p)=>s+p.qty,0);
    $('#stats').innerHTML =
      '<div class="stat"><b>'+parts.length+'</b><span>Total parts</span></div>'+
      '<div class="stat"><b>'+units.toLocaleString()+'</b><span>Units in stock</span></div>'+
      '<div class="stat"><b>'+Math.round(totalValue).toLocaleString()+'</b><span>Stock value (PKR)</span></div>'+
      '<div class="stat"><b>'+lowCount+'</b><span>Need reordering</span></div>'+
      '<div class="stat"><b>'+cats+'</b><span>Categories</span></div>';

    // chart
    const byCat = {};
    parts.forEach(p=>{ byCat[p.cat]=(byCat[p.cat]||0)+p.qty; });
    const max = Math.max(1,...Object.values(byCat));
    const chart = $('#chart');
    chart.innerHTML = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      '<div class="chart__row"><span class="muted">'+esc(k)+'</span><div class="chart__bar"><i data-w="'+(v/max*100)+'"></i></div><span class="chart__val">'+v.toLocaleString()+'</span></div>'
    ).join('') || '<p class="small muted">No data yet.</p>';
    requestAnimationFrame(()=>chart.querySelectorAll('.chart__bar i').forEach(i=>i.style.width=i.dataset.w+'%'));

    // alerts
    const alerts = parts.filter(p=>p.qty<=p.reorder).sort((a,b)=>a.qty-b.qty);
    $('#alerts').innerHTML = alerts.length ? alerts.map(p=>
      '<li><span class="badge '+(p.qty===0?'badge--bad':'badge--warn')+'">'+esc(p.pno)+'</span> '+
      esc(p.name)+' — '+(p.qty===0?'out of stock':'only '+p.qty+' left, reorder at '+p.reorder)+'</li>'
    ).join('') : '<li class="muted">Everything is above its reorder level. Nice.</li>';

    // category filter options
    const sel = $('#catFilter');
    const current = sel.value;
    const unique = [...new Set(parts.map(p=>p.cat))].sort();
    sel.innerHTML = '<option value="">All categories</option>' + unique.map(c=>'<option>'+esc(c)+'</option>').join('');
    sel.value = unique.includes(current) ? current : '';
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // events
  $('#tbody').addEventListener('click', (e)=>{
    const t = e.target.closest('button'); if(!t) return;
    const id = t.dataset.inc||t.dataset.dec||t.dataset.edit||t.dataset.del;
    const p = parts.find(x=>x.id===id); if(!p) return;
    if(t.dataset.inc!==undefined){ p.qty=Math.max(0,p.qty+1); save(); render(); }
    else if(t.dataset.dec!==undefined){ p.qty=Math.max(0,p.qty-1); save(); render(); }
    else if(t.dataset.edit!==undefined){ openSheet(p); }
    else if(t.dataset.del!==undefined){
      if(confirm('Delete "'+p.name+'"? This cannot be undone.')){ parts=parts.filter(x=>x.id!==id); save(); render(); toast('Part deleted'); }
    }
  });

  ['search','catFilter','sortBy','lowOnly'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  const sheet = $('#sheet');
  const form = $('#partForm');
  function openSheet(p){
    $('#sheetTitle').textContent = p ? 'Edit part' : 'Add a new part';
    form.id.value = p ? p.id : '';
    form.pno.value = p ? p.pno : nextPno();
    form.name.value = p ? p.name : '';
    form.cat.value = p ? p.cat : 'Electronics';
    form.qty.value = p ? p.qty : 0;
    form.cost.value = p ? p.cost : 0;
    form.reorder.value = p ? p.reorder : 10;
    form.supplier.value = p ? p.supplier : '';
    sheet.hidden = false;
    setTimeout(()=>form.pno.focus(), 50);
  }
  function nextPno(){
    const nums = parts.map(p=>parseInt(String(p.pno).replace(/\D/g,''),10)).filter(n=>!isNaN(n));
    return 'BOM-'+(nums.length? Math.max(...nums)+1 : 1001);
  }
  $('#addBtn').addEventListener('click', ()=>openSheet(null));
  $('#cancelBtn').addEventListener('click', ()=>{ sheet.hidden = true; });
  sheet.addEventListener('click', e=>{ if(e.target===sheet) sheet.hidden=true; });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') sheet.hidden=true; });

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    data.qty = Number(data.qty)||0;
    data.cost = Number(data.cost)||0;
    data.reorder = Number(data.reorder)||0;
    if(data.id){
      const i = parts.findIndex(p=>p.id===data.id);
      if(i>-1) parts[i] = {...parts[i], ...data};
      toast('Part updated');
    }else{
      parts.push({...data, id:uid()});
      toast('Part added to the BOM');
    }
    save(); render(); sheet.hidden = true;
  });

  $('#seedBtn').addEventListener('click', ()=>{
    parts = SAMPLE.map(p=>({...p,id:uid()}));
    save(); render(); toast('Sample inventory loaded');
  });

  $('#exportBtn').addEventListener('click', ()=>{
    const head = ['Part No','Name','Category','Supplier','Qty','Unit Cost','Reorder Level','Status'];
    const rows = parts.map(p=>[p.pno,p.name,p.cat,p.supplier,p.qty,p.cost,p.reorder,status(p).label]);
    const csv = [head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bom-inventory.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('CSV exported');
  });

  render();
})();
</script>
</body>
</html>
