<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Prompt Generator — Live Demo</title>
<link rel="icon" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/demo.css" />
<style>
  .layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:1.1rem;align-items:start}
  @media (max-width:880px){.layout{grid-template-columns:1fr}}
  .cats{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-bottom:.9rem}
  @media (max-width:480px){.cats{grid-template-columns:1fr}}
  .cat{
    padding:.6rem .8rem;border-radius:11px;border:1px solid var(--border);background:var(--surface);
    cursor:pointer;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:.5rem;
    transition:all .25s ease;
  }
  .cat:hover{border-color:var(--border2);transform:translateY(-2px)}
  .cat.active{background:var(--grad-soft);border-color:var(--violet);color:#fff;box-shadow:0 10px 24px -14px rgba(139,92,246,.9)}
  .cat .ico{width:16px;height:16px;color:var(--violet2)}
  .cat.active .ico{color:#fff}
  .out{
    background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;padding:1rem;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;line-height:1.75;
    white-space:pre-wrap;word-break:break-word;min-height:260px;color:#d9cff5;
  }
  .out b{color:var(--violet2)}
  .tpl-list{display:grid;gap:.5rem;margin-top:.8rem}
  .tpl{
    padding:.7rem .85rem;border-radius:11px;border:1px solid var(--border);background:var(--surface);
    cursor:pointer;transition:all .25s ease;
  }
  .tpl:hover{border-color:var(--violet);transform:translateX(4px)}
  .tpl b{display:block;font-size:.86rem;margin-bottom:.15rem}
  .tpl span{font-size:.75rem;color:var(--muted);display:block}
  .history{display:grid;gap:.4rem;max-height:230px;overflow:auto}
  .history .tpl{transform:none}
  .split2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  @media (max-width:520px){.split2{grid-template-columns:1fr}}
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar__mark">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9z" fill="currentColor" stroke="none"/></svg>
    </div>
    <div>
      <div class="topbar__brand">AI Prompt Generator</div>
      <span class="topbar__sub">Template engine · built for study &amp; code</span>
    </div>
    <div class="topbar__spacer"></div>
    <div class="topbar__right">
      <button class="btn btn--sm" id="randomBtn">Randomise</button>
      <button class="btn btn--sm btn--primary" id="copyBtn">Copy prompt</button>
    </div>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="panel__title">1 · Pick a goal</div>
      <div class="cats" id="cats"></div>

      <div class="panel__title">2 · Add your details</div>
      <div class="sheet__grid" style="display:grid;gap:.8rem">
        <div class="field"><label for="topic">Topic / task</label><input id="topic" placeholder="e.g. CSS grid layout" value="CSS grid layout" /></div>
        <div class="split2">
          <div class="field"><label for="tone">Tone</label>
            <select id="tone">
              <option value="clear and beginner-friendly">Clear / beginner</option>
              <option value="concise and technical">Concise / technical</option>
              <option value="detailed and academic">Detailed / academic</option>
              <option value="friendly and conversational">Friendly / casual</option>
            </select>
          </div>
          <div class="field"><label for="level">Level</label>
            <select id="level">
              <option value="a short overview">Short overview</option>
              <option value="a step-by-step walkthrough">Step-by-step</option>
              <option value="a full deep-dive with examples">Full deep-dive</option>
            </select>
          </div>
        </div>
        <div class="field"><label for="extra">Extra context (optional)</label><textarea id="extra" rows="3" placeholder="Anything else the AI should know — your level, constraints, deadlines…"></textarea></div>
      </div>

      <div class="panel__title" style="margin-top:1.2rem">Templates in “<span id="catName">Study</span>”</div>
      <div class="tpl-list" id="tplList"></div>
    </section>

    <section class="panel">
      <div class="panel__title">3 · Your generated prompt</div>
      <div class="out" id="out"></div>
      <div class="chips" id="chips"></div>
      <div class="panel__title" style="margin-top:1.3rem">Prompt history</div>
      <div class="history" id="history"><p class="small muted">Prompts you generate appear here for this session.</p></div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const $=(s,c=document)=>c.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  const DATA={
    Study:[
      {id:'s1',name:'Explain a concept',icon:'i-book',desc:'Simple explanation with an example',
       build:t=>'You are an experienced teacher. Explain <b>'+t.topic+'</b> to me in '+t.tone+' language. Give me '+t.level+'. Start with a one-line definition, then break it into numbered steps, then show one practical example, and finish with the two most common mistakes people make.'},
      {id:'s2',name:'Exam preparation',icon:'i-book',desc:'Condensed revision sheet',
       build:t=>'Create revision notes for <b>'+t.topic+'</b> for my exam. Make it '+t.tone+' and provide '+t.level+'. Use a definition table, 5 key points, 3 worked examples, and 5 likely exam questions with short answers.'},
      {id:'s3',name:'Flashcards',icon:'i-book',desc:'Q&A cards for memorisation',
       build:t=>'Write 12 flashcards on <b>'+t.topic+'</b>. Keep them '+t.tone+' and provide '+t.level+'. Format every card as "Q: … / A: …" and order them from easy to difficult. End with the three cards I should revise most.'}
    ],
    Coding:[
      {id:'c1',name:'Write a feature',icon:'i-code',desc:'Build it step by step',
       build:t=>'I am building a web app in HTML, CSS and JavaScript. Please implement <b>'+t.topic+'</b>. Explain in a '+t.tone+' way and give '+t.level+'. Give me the file structure, the complete code with comments, and then explain how each part works. Prefer small, readable functions over clever one-liners.'},
      {id:'c2',name:'Review my code',icon:'i-code',desc:'Find bugs and improve it',
       build:t=>'Here is my code for <b>'+t.topic+'</b>:\n\n```\n[paste your code]\n```\n\nReview it in a '+t.tone+' tone with '+t.level+'. List the bugs, explain why each one happens, and give me the corrected version.'},
      {id:'c3',name:'Debug an error',icon:'i-code',desc:'Work backwards from the error',
       build:t=>'I am getting this error while working on <b>'+t.topic+'</b>:\n\n```\n[paste the error]\n```\n\nIn a '+t.tone+' way, work out the most likely causes, show me how to test each one, and then give the fix. Provide '+t.level+'.'}
    ],
    Debug:[
      {id:'d1',name:'Why is this broken?',icon:'i-bug',desc:'Systematic root-cause analysis',
       build:t=>'My code for <b>'+t.topic+'</b> is not working as expected. Describe the expected result, then the actual result, then paste the code. Explain in a '+t.tone+' way with '+t.level+', and give me a checklist of the most common causes for this exact symptom.'},
      {id:'d2',name:'Performance',icon:'i-bug',desc:'Make it faster',
       build:t=>'Review <b>'+t.topic+'</b> for performance problems. Explain in a '+t.tone+' way with '+t.level+'. Point out what is slow, why it is slow, and give me the optimised code plus a short benchmark plan so I can measure the improvement myself.'},
      {id:'d3',name:'Simplify my code',icon:'i-bug',desc:'Cleaner, shorter, still readable',
       build:t=>'Rewrite <b>'+t.topic+'</b> so it is simpler and easier to read, without changing its behaviour. Keep the explanation '+t.tone+' and give '+t.level+'. Show the before and after side by side and explain each change you made.'}
    ],
    Writing:[
      {id:'w1',name:'Blog post',icon:'i-pen',desc:'Structured article',
       build:t=>'Write a blog post about <b>'+t.topic+'</b>. The tone should be '+t.tone+' and the length should be '+t.level+'. Give it a catchy title, a hook in the first two lines, clear subheadings, and finish with three takeaways.'},
      {id:'w2',name:'Email or message',icon:'i-pen',desc:'Short and professional',
       build:t=>'Write a '+t.tone+' email about <b>'+t.topic+'</b>. Give '+t.level+'. Include a subject line, a short greeting, the main message in three sentences, and a friendly sign-off. Keep it under 150 words.'},
      {id:'w3',name:'Explain like I am 12',icon:'i-pen',desc:'Plain-language version',
       build:t=>'Explain <b>'+t.topic+'</b> as if I am 12 years old, in a '+t.tone+' way with '+t.level+'. Use everyday language, one good analogy, and a short quiz at the end to check I understood.'}
    ],
    Analysis:[
      {id:'a1',name:'Compare two options',icon:'i-chart',desc:'Balanced decision table',
       build:t=>'Compare the options for <b>'+t.topic+'</b>. Give '+t.level+' in a '+t.tone+' tone. Use a comparison table (criteria, option A, option B), then a recommendation with the reasoning, and finally the main risk of that recommendation.'},
      {id:'a2',name:'Break down a topic',icon:'i-chart',desc:'First principles thinking',
       build:t=>'Break <b>'+t.topic+'</b> down to first principles. Explain in a '+t.tone+' way with '+t.level+'. Show what it is made of, which parts matter most, and which parts are usually over-complicated.'},
      {id:'a3',name:'Find the gaps',icon:'i-chart',desc:'What am I missing?',
       build:t=>'Here is what I know about <b>'+t.topic+'</b>: [paste your notes]. In a '+t.tone+' way with '+t.level+', tell me what is missing, what is commonly misunderstood, and what I should learn next.'}
    ],
    Planning:[
      {id:'p1',name:'Build a study plan',icon:'i-flag',desc:'Week-by-week schedule',
       build:t=>'Make a '+t.level+' study plan for <b>'+t.topic+'</b> in a '+t.tone+' tone. Give me a week-by-week breakdown with daily tasks, a weekly review checkpoint, and what to do on a day when I have less time.'},
      {id:'p2',name:'Plan a project',icon:'i-flag',desc:'Milestones and risks',
       build:t=>'Plan the project <b>'+t.topic+'</b>. Provide '+t.level+' in a '+t.tone+' tone. Include the goal, the milestones in order, the tech stack you would use for a beginner-friendly build, and the three most likely risks with mitigations.'},
      {id:'p3',name:'Turn an idea into steps',icon:'i-flag',desc:'From vague to actionable',
       build:t=>'I want to build <b>'+t.topic+'</b> but I do not know where to start. Give '+t.level+' in a '+t.tone+' tone. Break it into the smallest possible next steps, mark which ones I can finish in a single evening, and tell me what to do first.'}
    ]
  };

  const ICONS={
    'i-book':'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z" stroke-width="1.8"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5" stroke-width="1.8"/>',
    'i-code':'<path d="m9 7-5 5 5 5M15 7l5 5-5 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    'i-bug':'<rect x="8" y="8" width="8" height="11" rx="4" stroke-width="1.7"/><path d="M8 12H4m16 0h-4M8 17H4m16 0h-4M12 5V3" stroke-width="1.7" stroke-linecap="round"/>',
    'i-pen':'<path d="m4 20 4-1 10-10a2.1 2.1 0 0 0-3-3L5 16z" stroke-width="1.8" stroke-linejoin="round"/>',
    'i-chart':'<path d="M4 20V9m6 11V4m6 16v-7m6 7H2" stroke-width="1.8" stroke-linecap="round"/>',
    'i-flag':'<path d="M5 21V4m0 0 6 2 4-2 4 2v9l-4 2-4-2-6 2" stroke-width="1.8" stroke-linejoin="round"/>'
  };

  const state={cat:'Study',tpl:'s1',history:[]};
  const out=$('#out');

  function buildText(){
    const cat=Object.keys(DATA).find(c=>DATA[c].some(t=>t.id===state.tpl));
    const tpl=DATA[cat].find(t=>t.id===state.tpl);
    const topic=esc($('#topic').value.trim()||'your topic');
    const tone=$('#tone').value;
    const level=$('#level').value;
    const extra=esc($('#extra').value.trim());
    let text=tpl.build({topic:topic,tone:tone,level:level});
    if(extra) text+='\n\nAdditional context: '+extra;
    return text;
  }

  function renderCats(){
    $('#cats').innerHTML=Object.keys(DATA).map(c=>
      '<button class="cat'+(c===state.cat?' active':'')+'" data-cat="'+c+'">'+
      '<svg class="ico" viewBox="0 0 24 24">'+(ICONS[DATA[c][0].icon]||'')+'</svg>'+esc(c)+'</button>'
    ).join('');
    $('#catName').textContent=state.cat;
  }

  function renderTemplates(){
    $('#tplList').innerHTML=DATA[state.cat].map(t=>
      '<div class="tpl" data-tpl="'+t.id+'"><b>'+esc(t.name)+'</b><span>'+esc(t.desc)+'</span></div>'
    ).join('');
  }

  function renderOut(){
    const text=buildText();
    out.innerHTML=text.replace(/<b>(.*?)<\/b>/g,'<b>$1</b>');
    $('#chips').innerHTML=[
      'Tone: '+esc($('#tone').value),
      'Depth: '+esc($('#level').value),
      'Category: '+esc(state.cat)
    ].map(c=>'<span class="badge badge--v">'+c+'</span>').join('');
  }

  function pushHistory(){
    const text=buildText().replace(/<[^>]+>/g,'');
    state.history.unshift(text);
    state.history=state.history.slice(0,8);
    $('#history').innerHTML=state.history.map((h,i)=>
      '<div class="tpl" data-h="'+i+'"><b>Prompt '+(i+1)+'</b><span>'+esc(h.slice(0,90))+'…</span></div>'
    ).join('');
  }

  $('#cats').addEventListener('click',e=>{
    const b=e.target.closest('[data-cat]'); if(!b) return;
    state.cat=b.dataset.cat; state.tpl=DATA[state.cat][0].id;
    renderCats(); renderTemplates(); renderOut();
  });
  $('#tplList').addEventListener('click',e=>{
    const b=e.target.closest('[data-tpl]'); if(!b) return;
    state.tpl=b.dataset.tpl; renderTemplates(); renderOut();
  });
  ['topic','tone','level','extra'].forEach(id=>{
    document.getElementById(id).addEventListener('input',renderOut);
    document.getElementById(id).addEventListener('change',renderOut);
  });

  $('#copyBtn').addEventListener('click',()=>{
    const text=buildText().replace(/<[^>]+>/g,'');
    const done=()=>{ pushHistory(); toast('Prompt copied to clipboard'); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
    else done();
  });

  $('#randomBtn').addEventListener('click',()=>{
    const cats=Object.keys(DATA);
    state.cat=cats[Math.floor(Math.random()*cats.length)];
    const list=DATA[state.cat];
    state.tpl=list[Math.floor(Math.random()*list.length)].id;
    const topics=['CSS grid layout','JavaScript arrays','normalisation in databases','recursion','Linux file permissions','HTTP requests','sorting algorithms','AI model training','version control with Git','data visualisation'];
    $('#topic').value=topics[Math.floor(Math.random()*topics.length)];
    renderCats(); renderTemplates(); renderOut(); toast('New prompt generated');
  });

  $('#history').addEventListener('click',e=>{
    const b=e.target.closest('[data-h]'); if(!b) return;
    const text=state.history[+b.dataset.h];
    const done=()=>toast('Copied from history');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
    else done();
  });

  const toastEl=$('#toast');
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),2200); }

  renderCats(); renderTemplates(); renderOut();
})();
</script>
</body>
</html>
